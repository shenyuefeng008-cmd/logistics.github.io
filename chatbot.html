<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLLogi 捷流物流 — AI 客服</title>
<style>
  :root {
    --primary: #0A1628;
    --accent: #FF6B00;
    --bg: #F5F7FA;
    --white: #ffffff;
    --text: #1A2B3C;
    --border: #E2E8F0;
    --shadow: 0 8px 32px rgba(10,22,40,0.12);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--primary);
    color: var(--white);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; opacity: 0.7; }

  main { flex: 1; max-width: 760px; width: 100%; margin: 32px auto; padding: 0 16px; display: flex; flex-direction: column; }

  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 480px;
    max-height: 70vh;
  }

  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .avatar.bot { background: var(--accent); }
  .bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 15px;
    word-break: break-word;
  }
  .msg.bot .bubble { background: var(--primary); color: var(--white); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: #E8F0FE; color: var(--text); border-bottom-right-radius: 4px; }
  .bubble.loading::after { content: '...'; animation: dots 1s steps(4,end) infinite; }
  @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

  #input-area { margin-top: 16px; display: flex; gap: 12px; }
  #input-area input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input-area input:focus { border-color: var(--accent); }
  #input-area button {
    padding: 14px 24px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #input-area button:hover { opacity: 0.85; }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .quick-btns button {
    padding: 8px 16px;
    border: 1.5px solid var(--border);
    background: var(--white);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }
  .quick-btns button:hover { border-color: var(--accent); color: var(--accent); background: #FFF3EB; }

  footer { text-align: center; padding: 16px; font-size: 12px; color: #888; }
</style>
</head>
<body>

<header>
  <div style="width:40px;height:40px;border-radius:50%;background:#FF6B00;display:flex;align-items:center;justify-content:center;font-size:20px;">🚚</div>
  <div>
    <h1>JLLogi 捷流物流 AI 客服</h1>
    <span>Powered by AI · JLLogi 捷流物流</span>
  </div>
</header>

<main>
  <div id="chat-box">
    <div class="msg bot">
      <div class="avatar bot">💁</div>
      <div class="bubble">您好！我是 JLLogi 捷流物流的 AI 客服 🤖<br><br>专注国际快递18年，覆盖220+国家。可为您提供：<br>• 📦 国际快递（UPS/FedEx，3-7天）<br>• ✈️ 国际空运（5-10天）<br>• 🚢 美森海运（15-25天）<br>• 🛤️ 专线物流（10-20天）<br><br>请问有什么可以帮您？</div>
    </div>
  </div>

  <div class="quick-btns">
    <button onclick="ask('寄到美国怎么收费？')">寄到美国怎么收费？</button>
    <button onclick="ask('我的包裹到哪了？')">我的包裹到哪了？</button>
    <button onclick="ask('哪些是国家禁止寄送的？')">哪些东西不能寄？</button>
    <button onclick="ask('液体可以寄国际快递吗？')">液体可以寄吗？</button>
    <button onclick="ask('时效最快要几天？')">最快几天到？</button>
  </div>

  <div id="input-area">
    <input type="text" id="msgInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="sendBtn" onclick="sendMsg()">发送</button>
  </div>
</main>

<footer>JLLogi 捷流物流 · AI 智能客服</footer>

<script>
// ── 接口地址（部署 Worker 后替换为实际域名） ──
const CHAT_API = "/api/chat";

const chatBox = document.getElementById("chat-box");
const msgInput = document.getElementById("msgInput");
const sendBtn  = document.getElementById("sendBtn");

function addBubble(role, text, loading = false) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const avatar = role === "bot"
    ? '<div class="avatar bot">💁</div>'
    : '<div class="avatar">👤</div>';
  const bubble = `<div class="bubble${loading ? " loading" : ""}">${loading ? "正在回复..." : escapeHtml(text)}</div>`;
  div.innerHTML = role === "bot" ? avatar + bubble : bubble + avatar;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function ask(text) {
  msgInput.value = text;
  sendMsg();
}

async function sendMsg() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = "";
  sendBtn.disabled = true;

  addBubble("user", text);
  const botDiv = addBubble("bot", "", true);

  try {
    const resp = await fetch(CHAT_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, max_tokens: 500 }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      botDiv.querySelector(".bubble").innerHTML = `❌ 服务暂不可用，请稍后重试。`;
      return;
    }

    const data = await resp.json();
    const reply = data.reply || data.choices?.[0]?.message?.content || "（无回复）";
    botDiv.querySelector(".bubble").classList.remove("loading");
    botDiv.querySelector(".bubble").innerHTML = escapeHtml(reply);

  } catch (e) {
    botDiv.querySelector(".bubble").classList.remove("loading");
    botDiv.querySelector(".bubble").innerHTML = `❌ 网络错误，请检查网络后重试。`;
  } finally {
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

msgInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
msgInput.focus();
</script>

</body>
</html>
